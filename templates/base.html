{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}Beluni{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --beluni-petroleo: #20494A;
            --beluni-petroleo-escuro: #173839;
            --beluni-areia: #E8DDC8;
            --beluni-fundo: #F7F5EF;
            --beluni-branco: #FFFFFF;
            --beluni-texto: #293B3B;
            --beluni-secundario: #758080;
            --beluni-borda: #E5E2D9;
        }

        body {
            background-color: var(--beluni-fundo);
            color: var(--beluni-texto);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .navbar {
            background-color: var(--beluni-petroleo);
            padding: 14px 0;
        }

        .navbar-brand {
            color: var(--beluni-areia);
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .navbar-brand:hover {
            color: var(--beluni-branco);
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        .menu-link {
            color: #F7F5EF;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 8px;
            display: block;
            transition: background-color 0.2s;
        }

        .menu-link:hover {
            background-color: rgba(255, 255, 255, 0.12);
            color: var(--beluni-areia);
        }

        .conteudo {
            padding: 32px;
        }

        .titulo-pagina {
            color: var(--beluni-petroleo);
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--beluni-branco);
            border: 1px solid var(--beluni-borda);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(32, 73, 74, 0.05);
        }

        .table {
            color: var(--beluni-texto);
        }

        .table thead th {
            background-color: var(--beluni-areia);
            color: var(--beluni-petroleo-escuro);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 15px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .table td {
            padding: 16px 12px;
            border-color: var(--beluni-borda);
        }

        .table-hover tbody tr:hover > * {
            background-color: #F8F6F0;
        }

        .btn-primary {
            background-color: var(--beluni-petroleo);
            border-color: var(--beluni-petroleo);
            border-radius: 8px;
            padding: 9px 16px;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--beluni-petroleo-escuro);
            border-color: var(--beluni-petroleo-escuro);
        }

        .btn-outline-primary {
            color: var(--beluni-petroleo);
            border-color: var(--beluni-petroleo);
            border-radius: 7px;
        }

        .btn-outline-primary:hover {
            background-color: var(--beluni-petroleo);
            border-color: var(--beluni-petroleo);
        }

        .form-control,
        .form-select,
        form input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
        form select,
        form textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            border: 1px solid var(--beluni-borda);
            border-radius: 8px;
            padding: 10px 12px;
            background-color: var(--beluni-branco);
            color: var(--beluni-texto);
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        form select[multiple] {
            min-height: 120px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
        }

        .form-control:focus,
        .form-select:focus,
        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: var(--beluni-petroleo);
            box-shadow: 0 0 0 0.2rem rgba(32, 73, 74, 0.12);
            outline: none;
        }

        .text-secondary {
            color: var(--beluni-secundario) !important;
        }

        @media (max-width: 768px) {
            .conteudo {
                padding: 18px 12px;
            }

            .titulo-pagina {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{% url 'listar_atividades' %}">
                Beluni
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuBeluni"
                aria-controls="menuBeluni"
                aria-expanded="false"
                aria-label="Abrir menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuBeluni">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="menu-link" href="{% url 'listar_atividades' %}">
                            Atividades
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="menu-link" href="{% url 'listar_disciplinas' %}">
                            Disciplinas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="menu-link" href="{% url 'listar_metas' %}">
                            Metas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="menu-link" href="{% url 'notificacao:listar_notificacoes' %}">
                            Notificações
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid conteudo">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                     role="alert">
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Fechar">
                    </button>
                </div>
            {% endfor %}
        {% endif %}

        {% block conteudo %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
