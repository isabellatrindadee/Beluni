<!DOCTYPE html>
<html>
<head>
    <title>{{ estudante.nome }}</title>
</head>
<body>

    <h1>{{ estudante.nome }}</h1>

    <p><strong>CPF:</strong> {{ estudante.cpf }}</p>
    <p><strong>Usuário:</strong> {{ estudante.usuario }}</p>

    <a href="{% url 'editar_estudante' estudante.id %}">
        Editar

    <a href="{% url 'excluir_estudante' estudante.id %}">
        Excluir
    </a>

    <br><br>

    <a href="{% url 'listar_estudantes' %}">
        Voltar para estudantes
    </a>

</body>
</html>
