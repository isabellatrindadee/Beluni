<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Beluni</title>
</head>

<body>

    <h1>Login</h1>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <p>
            <label for="username">Usuário:</label>
            <input type="text" name="username" id="username" required>
        </p>

        <p>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" required>
        </p>

        <button type="submit">Entrar</button>

    </form>

    <p>
        Primeiro acesso?
        <a href="{% url 'criar_estudante' %}">
            Cadastre-se
        </a>
    </p>

</body>

</html>
