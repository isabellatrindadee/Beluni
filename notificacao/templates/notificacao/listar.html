<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Notificações</h1>

        <a href="{% url 'criar_notificacao' %}" class="btn btn-primary">
            Nova notificação
        </a>
    </div>

    {% if notificacoes %}

        <div class="list-group">

            {% for notificacao in notificacoes %}

                <div class="list-group-item">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>
                            <h5 class="mb-1">
                                {{ notificacao.mensagem }}
                            </h5>

                            <small class="text-muted">
                                Estudante: {{ notificacao.estudante }}
                            </small>
                        </div>

                        <div>

                            <a href="{% url 'visualizar_notificacao' notificacao.id %}"
                               class="btn btn-info btn-sm">
                                Visualizar
                            </a>

                            <a href="{% url 'editar_notificacao' notificacao.id %}"
                               class="btn btn-warning btn-sm">
                                Editar
                            </a>

                            <a href="{% url 'excluir_notificacao' notificacao.id %}"
                               class="btn btn-danger btn-sm">
                                Excluir
                            </a>

                        </div>

                    </div>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="alert alert-info">
            Nenhuma notificação cadastrada.
        </div>

    {% endif %}

</div>

</body>
</html>
