<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Notificação</title>
</head>

<body>

    <h1>Editar Notificação</h1>

    <p>
        {{ notificacao.mensagem }}
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Salvar
        </button>
    </form>

    <a href="{% url 'listar_notificacoes' %}">
        Cancelar
    </a>

</body>

</html>
